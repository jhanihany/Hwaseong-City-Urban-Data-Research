<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="화성시 어린이 안전지도 인터랙티브 지도 및 발표 포스터">
  <title>화성시 어린이 안전지도</title>
  <link rel="preload" as="image" href="assets/poster.webp">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="ribbon">
    <a class="brand" href="#" id="brandHome" aria-label="안전지도 보기">
      <span class="brand-icon">✦</span>
      <span class="brand-text">
        <strong>화성시 어린이 안전지도</strong>
        <small>Urban AI · 화성부기</small>
      </span>
    </a>

    <nav class="tabs" aria-label="보기 전환">
      <button class="tab active" id="mapTab" type="button">
        <span class="tab-dot"></span> 안전지도
      </button>
      <button class="tab" id="posterTab" type="button">
        발표 포스터 원본 보기
      </button>
    </nav>

    <a class="pdf-link" href="assets/original.pdf" target="_blank" rel="noopener">
      PDF ↗
    </a>
  </header>

  <main class="app-shell">
    <section class="view active" id="mapView" aria-label="화성시 어린이 안전지도">
      <iframe
        id="mapFrame"
        src="map.html"
        title="화성시 어린이 안전지도 인터랙티브 지도"
        loading="eager"
      ></iframe>

      <div class="map-guide">
        <strong>지도 이용 안내</strong>
        <span>핀에 마우스를 올리거나 탭하면 지역별 분석 결과를 확인할 수 있습니다.</span>
      </div>
    </section>

    <section class="view poster-view" id="posterView" aria-label="발표 포스터 원본">
      <div class="poster-scroll" id="posterScroll" tabindex="0">
        <div class="poster-stage" id="posterStage">
          <img
            src="assets/poster.webp"
            id="poster"
            alt="화성부기 어린이 안전 지도 발표 포스터"
            draggable="false"
          >
        </div>
      </div>

      <div class="poster-tools" role="group" aria-label="포스터 확대 축소">
        <button type="button" id="zoomOut" aria-label="축소">−</button>
        <button type="button" class="zoom-readout" id="zoomReadout" title="100%로 보기">100%</button>
        <button type="button" id="zoomIn" aria-label="확대">+</button>
        <button type="button" class="fit-button" id="fitWidth">화면 맞춤</button>
      </div>

      <div class="poster-hint" id="posterHint">
        PC: Ctrl/⌘ + 휠 확대 · 모바일: 두 손가락 확대
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
